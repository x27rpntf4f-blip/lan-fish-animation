name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and matrix Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src/fishmesh src/fish_demo tests scripts

      - name: ty
        run: uv run ty check src/fishmesh src/fish_demo

      - name: Test with coverage
        run: uv run pytest --cov=src --cov-report=term-missing

      - name: Exercise native Windows sprite safety paths
        if: runner.os == 'Windows'
        run: uv run pytest tests/test_sprite_names.py -v

      - name: Headless runtime smoke test
        run: uv run pytest tests/legacy/test_runtime_smoke.py -v
